name: Android CI

# Super Shelf: releases are tag-gated. A push to main only builds
# and assembles — it never publishes. A release publishes only when
# a v* tag is pushed, from the `release` job, which runs behind the
# `release` environment's manual approval (configured in the repo
# settings, with the maintainer as reviewer). No silent releases:
# every published build is a deliberate tag + an explicit approval.
#
# Signing: the signed release build runs ONLY when the four
# ANDROID_KEYSTORE_* secrets exist in this repo. Without them the
# build job still proves the code compiles by building a debug APK
# (artifact only, never published as a release — a debug build is
# disposable: it cannot update to a later signed release without
# an uninstall first). NOTE: GitHub's expression parser does NOT
# allow `secrets` in `if:` conditions (parse error, 0 jobs), so
# every signing gate here is a bash check inside the step, and the
# release job refuses loudly when the secrets are absent instead
# of publishing an unsigned release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore (skipped when secrets absent)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — signed build will be skipped."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch oboe (pinned)
        run: |
          mkdir -p third_party/oboe
          curl -sL -o /tmp/oboe.tar.gz https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz
          echo "e030276d25b8bdfaeb04f66646821b1ba4a2b6a580a7e84fb144a478eaecd663  /tmp/oboe.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oboe.tar.gz -C third_party/oboe --strip-components=1

      - name: Build debug APK (always; proves the strip compiles)
        run: ./gradlew :app:assembleDebug

      - name: Build signed release APK (skipped when secrets absent)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f "$ANDROID_KEYSTORE_FILE" ]; then
            echo "No release keystore — skipping signed release build."
            exit 0
          fi
          ./gradlew :app:assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-shelf-apk-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact (absent when unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: super-shelf-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Refuse to publish without signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_* secrets are not set in this repo — refusing to publish an unsigned release."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Download the signed APK
        uses: actions/download-artifact@v4
        with:
          name: super-shelf-apk
          path: apk

      - name: Read version and check the tag matches it
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match version $VERSION — refusing to publish."
            exit 1
          fi

      - name: Build release notes from the commit message
        id: notes
        run: |
          RAW=$(git log -1 --pretty=%B "${{ github.ref_name }}")
          NOTES=$(printf '%s\n' "$RAW" | tail -n +2 | sed -e '/./,$!d')
          if [ -z "$NOTES" ]; then
            NOTES="Beta build of Super Shelf."
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Super Shelf ${{ steps.version.outputs.version }} (beta)
          prerelease: true
          fail_on_unmatched_files: true
          files: apk/*.apk
          body: ${{ steps.notes.outputs.body }}
